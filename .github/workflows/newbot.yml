name: Entertainment Newsroom Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-test
        env:
          EXA_API_KEY: dummy
          CEREBRAS_API_KEY: dummy
          TELEGRAM_BOT_TOKEN: dummy
        run: python main.py --self-test

      - name: Run newsroom
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL: "@EntertainmentNewsroom"
          NEWS_MODE: "update"
          CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL }}
        run: python main.py

      - name: Commit persistent news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_state.json posted_urls.txt
          git diff --cached --quiet || git commit -m "chore: update newsroom state"
          git push
