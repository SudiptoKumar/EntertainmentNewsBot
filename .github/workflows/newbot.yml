name: Entertainment News Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-entertainment-news-bot:
    runs-on: ubuntu-latest

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@EntertainmentNewsroom"
      NEWS_MODE: "entertainment"
      PUBLISH_THRESHOLD: "80"
      MAX_POSTS_PER_RUN: "12"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Python source
        run: python -m py_compile main.py

      - name: Run Entertainment News Bot
        run: python main.py

      - name: Save state
        run: |
          git config user.name "Entertainment News Bot"
          git config user.email "actions@github.com"

          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update EntertainmentNewsroom state"
            git push
          fi
