name: Entertainment Newsroom

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1-17 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run self-test
        env:
          EXA_API_KEY: dummy
          CEREBRAS_API_KEY: dummy
          TELEGRAM_BOT_TOKEN: dummy
        run: python main.py --self-test

      - name: Run newsroom
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHANNEL: "@EntertainmentNewsroom"
          NEWS_MODE: "update"
          CEREBRAS_MODEL: "gpt-oss-120b"
        run: python main.py

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain news_state.json posted_urls.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news_state.json posted_urls.txt
            git commit -m "chore: update newsroom state" || true
            git push || true
          fi
